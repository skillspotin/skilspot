<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon_round.png" type="image/png">
    <title>Forgot Password - SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-size: 14.5px;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 50px;
            background: radial-gradient(circle at top left, rgba(99, 102, 241, 0.1), transparent 40%),
                radial-gradient(circle at bottom right, rgba(236, 72, 153, 0.1), transparent 40%);
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            margin-bottom: 10px;
            color: var(--text-main);
            font-family: var(--font-heading);
            font-weight: 800;
            text-align: center;
        }

        body.dark-mode .auth-header h2,
        body.dark .auth-header h2 {
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 20px;
        }

        .form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Navbar Injection -->
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header" style="text-align: center;">
                <h2>Reset Password</h2>
                <p style="color: var(--text-muted); font-size: 1rem;">Enter your email to receive a reset link</p>
            </div>

            <form id="forgotForm" onsubmit="handleForgot(event)">
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="form-group-inner">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-control" required placeholder="john@example.com">
                    </div>
                </div>

                <button type="submit" class="form-submit">Send Reset Link</button>
            </form>

            <div class="auth-footer">
                Remember your password? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script src="footer.js"></script>
    <script>
        function handleForgot(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Sending Link...';
            btn.disabled = true;

            setTimeout(() => {
                alert('Reset link sent to your email! Please check your inbox.');
                window.location.href = 'login.html';
            }, 1500);
        }
    </script>
</body>

</html>
