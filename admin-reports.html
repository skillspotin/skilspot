<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campaign Reports - Admin | SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="icon" href="images/favicon_round.png" type="image/png">
    <style>
        body {
            background-color: #f8fafc;
            color: #1e293b;
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
        }

        .dark-mode body {
            background-color: #0f172a;
            color: #f8fafc;
        }

        .reports-container {
            padding: 120px 20px 60px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .report-card {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        .dark-mode .report-card {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(255, 255, 255, 0.1);
        }

        .log-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        .log-table th,
        .log-table td {
            text-align: left;
            padding: 15px;
            border-bottom: 1px solid #e2e8f0;
        }

        .dark-mode .log-table th,
        .dark-mode .log-table td {
            border-color: rgba(255, 255, 255, 0.1);
        }

        .timestamp {
            color: #64748b;
            font-size: 0.8rem;
            white-space: nowrap;
        }

        .status-pill {
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .success {
            background: #dcfce7;
            color: #166534;
        }

        .info {
            background: #e0f2fe;
            color: #075985;
        }

        .warning {
            background: #fef3c7;
            color: #92400e;
        }

        .filter-btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            background: white;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            color: #64748b;
        }

        .filter-btn.active {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .filter-btn:hover:not(.active) {
            background: #f1f5f9;
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="reports-container">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
            <h1 style="font-size: 1.75rem; font-weight: 800; margin: 0;">AI Marketing <span
                    class="gradient-text">Reports</span></h1>
            <a href="admin.html" class="btn btn-secondary"
                style="padding: 10px 20px; text-decoration: none; font-weight: 600;">Back to Dashboard</a>
        </div>

        <div class="report-card">
            <div
                style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 20px;">
                <h2 style="font-size: 1.2rem; margin: 0;">Recent Campaign Logs</h2>
                <div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1; max-width: 600px;">
                    <div style="position: relative;">
                        <i class="fas fa-search"
                            style="position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #94a3b8;"></i>
                        <input type="text" id="logFilter" placeholder="Search name, email, or phone..."
                            style="width: 100%; padding: 10px 10px 10px 35px; border: 1px solid #e2e8f0; border-radius: 12px; font-size: 0.9rem; outline: none;">
                    </div>
                    <div style="display: flex; gap: 8px;">
                        <button class="filter-btn active" data-status="all">All Logs</button>
                        <button class="filter-btn" data-status="success">✅ Sent Successfully</button>
                        <button class="filter-btn" data-status="failed">❌ Errors/Blocks</button>
                        <button class="filter-btn" data-status="key">🎯 Key Events Only</button>
                    </div>
                </div>
                <button onclick="location.reload()" class="btn btn-primary"
                    style="padding: 10px 20px; font-size: 0.85rem;">Refresh Logs</button>
            </div>

            <div id="logContent">
                <table class="log-table">
                    <thead>
                        <tr>
                            <th>Time</th>
                            <th>Event / Detail</th>
                            <th>Email Address</th>
                            <th>Contact / Action</th>
                        </tr>
                    </thead>
                    <tbody id="logBody">
                        <!-- Logs will be injected here -->
                    </tbody>
                </table>
                <div id="noLogs" style="text-align: center; padding: 40px; display: none;">
                    <i class="fas fa-robot fa-3x" style="color: #cbd5e1; margin-bottom: 15px;"></i>
                    <p style="color: #64748b;">No logs found. Run the AI Marketing Agent to see data here.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- This script is generated by the AI Marketing Agent -->
    <script src="ai-marketing-agent/campaign-data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const logBody = document.getElementById('logBody');
            const noLogs = document.getElementById('noLogs');
            const logFilter = document.getElementById('logFilter');
            const filterBtns = document.querySelectorAll('.filter-btn');

            let currentStatus = 'all';

            function renderLogs() {
                const filterText = logFilter.value.toLowerCase();
                logBody.innerHTML = '';

                const filtered = (window.CAMPAIGN_LOGS || []).filter(log => {
                    const searchStr = `${log.message} ${log.email || ''} ${log.phone || ''}`.toLowerCase();
                    const matchesSearch = searchStr.includes(filterText);

                    const isSuccess = log.message.includes('✅') || log.type === 'SUCCESS';
                    const isFailed = log.message.includes('❌') || log.type === 'FAILED' || log.message.includes('Critical');
                    const isSkipped = log.message.includes('⏭️') || log.message.includes('⚠️') || log.type?.includes('SKIPPED');

                    if (currentStatus === 'success') return matchesSearch && isSuccess;
                    if (currentStatus === 'failed') return matchesSearch && isFailed;
                    if (currentStatus === 'key') return matchesSearch && (isSuccess || isFailed || isSkipped);
                    return matchesSearch;
                });

                if (filtered.length === 0) {
                    noLogs.style.display = 'block';
                    document.querySelector('.log-table').style.display = 'none';
                    return;
                }

                noLogs.style.display = 'none';
                document.querySelector('.log-table').style.display = 'table';

                filtered.forEach(log => {
                    const row = document.createElement('tr');

                    let pillClass = 'info';
                    if (log.message.includes('✅') || log.type === 'SUCCESS') pillClass = 'success';
                    if (log.message.includes('❌') || log.type === 'FAILED' || log.message.includes('Critical')) pillClass = 'warning';
                    if (log.message.includes('⏭️') || log.message.includes('⚠️')) pillClass = 'info';

                    let phoneHtml = log.phone || '-';
                    if (log.phone && log.phone !== 'N/A') {
                        const cleanName = (log.message.split('contacted ')[1] || log.message.split('send email to ')[1] || 'Business').replace(/["'“”]/g, '');
                        phoneHtml = `
                            <div style="display: flex; flex-direction: column; gap: 5px;">
                                <span>${log.phone}</span>
                                <button onclick="sendWhatsApp('${log.phone}', '${cleanName}')" 
                                    style="background: #25d366; color: white; border: none; padding: 4px 8px; border-radius: 6px; font-size: 0.7rem; font-weight: 800; cursor: pointer; width: fit-content;">
                                    <i class="fab fa-whatsapp"></i> Chat
                                </button>
                            </div>
                        `;
                    }

                    row.innerHTML = `
                        <td class="timestamp">${log.timestamp}</td>
                        <td>
                            <span class="status-pill ${pillClass}">${log.message}</span>
                        </td>
                        <td style="font-weight: 500; color: #475569;">${log.email || '-'}</td>
                        <td style="font-weight: 600; color: #6366f1;">${phoneHtml}</td>
                    `;
                    logBody.appendChild(row);
                });
            }

            window.sendWhatsApp = function (phone, name) {
                const cleanPhone = phone.replace(/\D/g, '');
                const finalPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;
                const text = encodeURIComponent(`Hi ${name}, this is Haris from SkillSpot. Regarding our recent email about the ₹2,999 website launch...`);
                window.open(`https://wa.me/${finalPhone}?text=${text}`, '_blank');
            };

            logFilter.addEventListener('input', renderLogs);

            filterBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    filterBtns.forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    currentStatus = btn.dataset.status;
                    renderLogs();
                });
            });

            renderLogs();
        });
    </script>

    <div id="footer-placeholder"></div>
    <script src="footer.js"></script>
</body>

</html>
