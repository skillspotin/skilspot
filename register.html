<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="images/favicon_round.png" type="image/png">
    <title>Register - SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <style>
        body {
            font-size: 14.5px;
        }

        .auth-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 120px 20px 50px;
            background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.1), transparent 40%),
                radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.1), transparent 40%);
        }

        .auth-card {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            padding: 40px;
            border-radius: 24px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .auth-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 30px 60px -12px rgba(99, 102, 241, 0.2);
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h2 {
            font-size: 1.75rem;
            margin-bottom: 10px;
            color: var(--text-main);
            font-family: var(--font-heading);
            font-weight: 800;
            text-align: center;
        }

        body.dark-mode .auth-header h2,
        body.dark .auth-header h2 {
            background: linear-gradient(135deg, #fff 0%, #a5b4fc 100%);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            border-radius: 12px;
            color: white;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .form-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: #6366f1;
            text-decoration: none;
            font-weight: 500;
        }
    </style>
</head>

<body>

    <!-- Navbar Injection -->
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header" style="text-align: center;">
                <h2>Create Account</h2>
                <p style="color: var(--text-muted); font-size: 1rem;">Join SkillSpot to unlock your potential</p>
            </div>

            <form id="registerForm" onsubmit="SkillSpotAuth.handleRegister(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <div class="form-group-inner">
                        <i class="fas fa-user input-icon"></i>
                        <input type="text" class="form-control" required placeholder="John Doe">
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="form-group-inner">
                        <i class="fas fa-envelope input-icon"></i>
                        <input type="email" class="form-control" required placeholder="john@example.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="form-group-inner">
                        <i class="fas fa-phone input-icon"></i>
                        <input type="tel" class="form-control" required placeholder="+91 99999 99999">
                    </div>
                </div>

                <div class="form-group">
                    <label>Role / Status</label>
                    <div class="form-group-inner">
                        <i class="fas fa-user-tag input-icon"></i>
                        <select class="form-control" id="roleSelect" onchange="toggleInstitutionField()">
                            <option value="student">Student</option>
                            <option value="professional">Working Professional</option>
                            <option value="freelancer">Freelancer</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                </div>

                <div class="form-group" id="institutionField">
                    <label>School / College Name</label>
                    <div class="form-group-inner">
                        <i class="fas fa-university input-icon"></i>
                        <input type="text" class="form-control" placeholder="Enter your institution name">
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="form-group-inner">
                        <i class="fas fa-lock input-icon"></i>
                        <input type="password" class="form-control" required placeholder="Create a strong password">
                    </div>
                </div>

                <button type="submit" class="form-submit">Register Now</button>
            </form>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>

            <div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 15px;">
                <div style="width: 100%; height: 1px; background: #e2e8f0; position: relative;">
                    <span
                        style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 0 10px; color: #64748b; font-size: 0.8rem;">OR</span>
                </div>
                <div id="g_id_onload"
                    data-client_id="929571954176-8t46u7o64rbqja5m37unflqqk2755olg.apps.googleusercontent.com"
                    data-callback="SkillSpotAuth.handleGoogleResponse" data-auto_prompt="false">
                </div>
                <div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline"
                    data-text="signin_with" data-shape="rectangular" data-logo_alignment="left">
                </div>
            </div>
        </div>
    </div>

    <div id="footer-placeholder"></div>
    <script src="footer.js"></script>
    <script src="auth.js"></script>
    <script>
        function toggleInstitutionField() {
            const role = document.getElementById('roleSelect').value;
            const label = document.querySelector('#institutionField label');
            const input = document.querySelector('#institutionField input');

            if (role === 'professional') {
                label.textContent = 'Company Name';
                input.placeholder = 'Enter your company name';
            } else if (role === 'student') {
                label.textContent = 'School / College Name';
                input.placeholder = 'Enter your institution name';
            } else {
                label.textContent = 'Organization (Optional)';
                input.placeholder = 'Enter organization name';
            }
        }

        function handleRegister(e) {
            e.preventDefault();
            // In a real app, this would send data to a backend
            // For now, we simulate success and redirect
            const btn = e.target.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = 'Creating Account...';
            btn.disabled = true;

            setTimeout(() => {
                alert('Registration Successful! Redirecting to dashboard...');
                window.location.href = 'index.html'; // Or dashboard.html
            }, 1500);
        }
    </script>
</body>

</html>
