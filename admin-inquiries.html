<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inquiry Management - Admin | SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: white;
            --border-color: #e2e8f0;
            --primary: #6366f1;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin: 0;
            padding-bottom: 60px;
        }

        .admin-container {
            padding: 120px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .inquiry-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 25px;
            margin-bottom: 20px;
            position: relative;
            transition: all 0.3s;
        }

        .inquiry-card:hover {
            border-color: var(--primary);
        }

        .inquiry-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 15px;
        }

        .inquiry-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            border-radius: 10px;
            font-weight: 700;
            text-transform: uppercase;
        }

        .source-contact {
            background: #e0f2fe;
            color: #0369a1;
        }

        .source-quote {
            background: #fef3c7;
            color: #92400e;
        }

        .client-info h3 {
            margin: 0;
            font-size: 1.1rem;
        }

        .client-info p {
            margin: 5px 0;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        .message-box {
            background: rgba(0, 0, 0, 0.02);
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .btn-delete {
            position: absolute;
            top: 25px;
            right: 25px;
            color: #ef4444;
            cursor: pointer;
            opacity: 0.5;
            transition: opacity 0.3s;
        }

        .btn-delete:hover {
            opacity: 1;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="admin-container">
        <div style="margin-bottom: 40px;">
            <h1 style="font-size: 2rem; font-weight: 800; margin: 0;">Lead <span class="gradient-text">Inquiries</span>
            </h1>
            <p style="opacity: 0.7; margin-top: 5px;">Manage contact requests and quote inquiries from the portal.</p>
        </div>

        <div id="inquiryList">
            <!-- Inquiries injected here -->
        </div>
    </div>

    <script>
        function loadInquiries() {
            const registry = JSON.parse(localStorage.getItem('ss_inquiry_registry') || '[]');
            const list = document.getElementById('inquiryList');

            if (registry.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-inbox fa-3x" style="margin-bottom: 15px;"></i>
                        <h2>No inquiries yet</h2>
                        <p>Leads from the contact form and quote generator will appear here.</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = '';
            registry.forEach((inq, index) => {
                const card = document.createElement('div');
                card.className = 'inquiry-card';
                const sourceClass = inq.source?.includes('Quote') ? 'source-quote' : 'source-contact';

                card.innerHTML = `
                    <div class="inquiry-header">
                        <div class="client-info">
                            <span class="inquiry-badge ${sourceClass}">${inq.source || 'General'}</span>
                            <h3 style="margin-top: 10px;">${inq.name}</h3>
                            <p><i class="fas fa-envelope" style="width: 20px;"></i> ${inq.email}</p>
                            <p><i class="fas fa-phone" style="width: 20px;"></i> ${inq.phone}</p>
                        </div>
                        <div style="text-align: right; opacity: 0.6; font-size: 0.8rem;">
                            ${inq.date}
                            <div style="margin-top: 10px;">
                                <button onclick="sendWhatsApp('${inq.phone}', '${inq.name}', '${inq.subject || 'Inquiry'}')" 
                                    style="background: #25d366; color: white; border: none; padding: 8px 15px; border-radius: 10px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 8px;">
                                    <i class="fab fa-whatsapp"></i> Chat
                                </button>
                            </div>
                        </div>
                    </div>
                    <div style="font-weight: 700; margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 15px;">
                        Subject: ${inq.subject || 'No Subject'}
                    </div>
                    <div class="message-box">${inq.message}</div>
                    <i class="fas fa-trash-alt btn-delete" onclick="deleteInquiry(${index})"></i>
                `;
                list.appendChild(card);
            });
        }

        function sendWhatsApp(phone, name, subject) {
            // Clean phone number (remove spaces, dashes)
            const cleanPhone = phone.replace(/\D/g, '');
            // International format (assume India +91 if not present)
            const finalPhone = cleanPhone.length === 10 ? '91' + cleanPhone : cleanPhone;

            const text = encodeURIComponent(`Hi ${name}, this is Haris from SkillSpot. Regarding your inquiry about "${subject}"...`);
            window.open(`https://wa.me/${finalPhone}?text=${text}`, '_blank');
        }

        function deleteInquiry(index) {
            if (confirm('Are you sure you want to delete this lead?')) {
                const registry = JSON.parse(localStorage.getItem('ss_inquiry_registry') || '[]');
                registry.splice(index, 1);
                localStorage.setItem('ss_inquiry_registry', JSON.stringify(registry));
                loadInquiries();
            }
        }

        loadInquiries();
    </script>
</body>

</html>
