<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Management - Admin | SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: white;
            --border-color: #e2e8f0;
            --primary: #6366f1;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
            margin: 0;
            padding-bottom: 60px;
        }

        .admin-container {
            padding: 120px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }

        .btn-add {
            background: #10b981;
            color: white;
            padding: 12px 24px;
            border-radius: 12px;
            text-decoration: none;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            border: none;
            cursor: pointer;
        }

        .courses-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 20px;
        }

        .course-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s;
        }

        .course-card:hover {
            transform: translateY(-5px);
        }

        .course-card h3 {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        .course-card .price {
            font-weight: 800;
            color: var(--primary);
            font-size: 1.2rem;
            margin-bottom: 15px;
        }

        .course-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .btn-action {
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
        }

        .btn-edit:hover {
            background: #6366f1;
            color: white;
            border-color: #6366f1;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 30px;
            border-radius: 24px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            opacity: 0.8;
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            background: rgba(0, 0, 0, 0.02);
            color: var(--text-color);
        }

        .modal-footer {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="admin-container">
        <div class="header-section">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; margin: 0;">Course <span
                        class="gradient-text">Management</span></h1>
                <p style="opacity: 0.7; margin-top: 5px;">Update, Add or Remove courses from the platform.</p>
            </div>
            <button class="btn-add" onclick="openModal()">
                <i class="fas fa-plus"></i> Add New Course
            </button>
        </div>

        <div class="courses-grid" id="coursesList">
            <!-- Courses injected here -->
        </div>
    </div>

    <!-- Course Modal -->
    <div class="modal" id="courseModal">
        <div class="modal-content">
            <h2 id="modalTitle">Add New Course</h2>
            <form id="courseForm">
                <input type="hidden" id="courseId">
                <div class="form-group">
                    <label>Course Title</label>
                    <input type="text" id="courseTitle" required placeholder="e.g., Python Mastery">
                </div>
                <div class="form-group">
                    <label>Price (₹)</label>
                    <input type="number" id="coursePrice" required placeholder="499">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <textarea id="courseDesc" rows="3" required
                        placeholder="Short description of the course..."></textarea>
                </div>
                <div class="form-group">
                    <label>Tag (e.g. Hot & Trending)</label>
                    <input type="text" id="courseTag" placeholder="Hot & Trending">
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn-action" onclick="closeModal()">Cancel</button>
                    <button type="submit" class="btn-add" style="padding: 10px 20px;">Save Course</button>
                </div>
            </form>
        </div>
    </div>

    <script src="premium-courses-data.js"></script>
    <script>
        let courses = JSON.parse(localStorage.getItem('ss_custom_courses')) || premiumCourses;

        function renderCourses() {
            const list = document.getElementById('coursesList');
            list.innerHTML = '';

            courses.forEach((c, index) => {
                const card = document.createElement('div');
                card.className = 'course-card';
                card.innerHTML = `
                    <div style="font-size: 0.75rem; color: #6366f1; font-weight: 700; text-transform: uppercase; margin-bottom: 10px;">${c.tag || 'Regular'}</div>
                    <h3>${c.title}</h3>
                    <div class="price">₹${c.price} <span style="font-size: 0.8rem; text-decoration: line-through; opacity: 0.5;">₹${c.originalPrice || c.price * 3}</span></div>
                    <p style="font-size: 0.85rem; opacity: 0.7; line-height: 1.5;">${c.description}</p>
                    <div class="course-actions">
                        <button class="btn-action btn-edit" onclick="editCourse(${index})">Edit</button>
                        <button class="btn-action btn-delete" onclick="deleteCourse(${index})">Delete</button>
                    </div>
                `;
                list.appendChild(card);
            });
            // Sync metadata for admin.html
            localStorage.setItem('ss_custom_courses', JSON.stringify(courses));
        }

        function openModal(index = -1) {
            const modal = document.getElementById('courseModal');
            const form = document.getElementById('courseForm');
            const title = document.getElementById('modalTitle');

            form.reset();
            document.getElementById('courseId').value = index;

            if (index > -1) {
                title.textContent = 'Edit Course';
                const c = courses[index];
                document.getElementById('courseTitle').value = c.title;
                document.getElementById('coursePrice').value = c.price;
                document.getElementById('courseDesc').value = c.description;
                document.getElementById('courseTag').value = c.tag || '';
            } else {
                title.textContent = 'Add New Course';
            }

            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('courseModal').style.display = 'none';
        }

        document.getElementById('courseForm').onsubmit = function (e) {
            e.preventDefault();
            const index = parseInt(document.getElementById('courseId').value);
            const newCourse = {
                id: 'course_' + Date.now(),
                title: document.getElementById('courseTitle').value,
                price: parseInt(document.getElementById('coursePrice').value),
                description: document.getElementById('courseDesc').value,
                tag: document.getElementById('courseTag').value,
                originalPrice: parseInt(document.getElementById('coursePrice').value) * 3,
                rating: 4.8,
                duration: "8 Weeks",
                projects: "4 Projects",
                image: "fa-solid fa-code",
                color: "#6366f1"
            };

            if (index > -1) {
                courses[index] = { ...courses[index], ...newCourse, id: courses[index].id };
            } else {
                courses.unshift(newCourse);
            }

            renderCourses();
            closeModal();
            alert('Courses updated successfully!');
        };

        function deleteCourse(index) {
            if (confirm('Are you sure you want to delete this course?')) {
                courses.splice(index, 1);
                renderCourses();
            }
        }

        window.onclick = function (event) {
            if (event.target == document.getElementById('courseModal')) {
                closeModal();
            }
        }

        renderCourses();
    </script>
</body>

</html>
