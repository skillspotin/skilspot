<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: white;
            --border-color: #e2e8f0;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14.5px;
        }

        .dashboard-container {
            padding: 100px 20px 40px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-buttons {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            text-decoration: none;
            display: block;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.05);
        }

        body.dark-mode .stat-card {
            box-shadow: none;
        }

        .stat-card h3 {
            color: var(--text-color);
            opacity: 0.7;
            font-size: 0.9rem;
            margin-bottom: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-card h3 i {
            font-size: 0.8rem;
            color: var(--primary);
            opacity: 0.5;
        }

        .stat-card .value {
            font-size: 2rem;
            font-weight: 800;
            color: var(--text-color);
        }

        .stat-card .manage-label {
            font-size: 0.7rem;
            color: var(--primary);
            font-weight: 600;
            margin-top: 10px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .data-table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            overflow: hidden;
            backdrop-filter: blur(10px);
            overflow-x: auto;
            /* Allow horizontal scroll on mobile */
        }

        .table-header {
            padding: 20px;
            background: var(--card-bg);
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            color: var(--text-color);
            min-width: 600px;
            /* Force minimum width for scroll */
        }

        th,
        td {
            text-align: left;
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            color: var(--text-color);
            opacity: 0.7;
            font-weight: 600;
            font-size: 0.9rem;
        }

        tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .status-badge {
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .status-active {
            background: rgba(16, 185, 129, 0.2);
            color: #10b981;
        }

        .status-pending {
            background: rgba(245, 158, 11, 0.2);
            color: #f59e0b;
        }

        .avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #6366f1;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 0.8rem;
            color: white;
            flex-shrink: 0;
        }

        h1,
        h2 {
            color: var(--text-color) !important;
        }

        @media (max-width: 768px) {
            .header-actions {
                flex-direction: column;
                align-items: flex-start;
            }

            .header-buttons {
                width: 100%;
                flex-direction: column;
            }

            .header-buttons a {
                width: 100%;
                justify-content: center;
            }
        }
    </style>
</head>

<body>

    <!-- Navbar Injection -->
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="dashboard-container">

        <div class="header-actions">
            <h1 style="font-size: 1.75rem; font-weight: 800; font-family: var(--font-heading);">Admin Dashboard</h1>
            <div class="header-buttons">
                <a href="admin-upload.html" class="btn btn-primary"
                    style="padding: 12px 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; background: #10b981;">
                    <i class="fas fa-image"></i> Image Upload Manager
                </a>
                <a href="admin-quote.html" class="btn btn-primary"
                    style="padding: 12px 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px;">
                    <i class="fas fa-file-invoice"></i> Manual Quote Generator
                </a>
                <a href="admin-blog.html" class="btn btn-primary"
                    style="padding: 12px 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; background: #8b5cf6;">
                    <i class="fas fa-pen-nib"></i> Blog Upload Manager
                </a>
                <a href="admin-reports.html" class="btn btn-primary"
                    style="padding: 12px 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; background: #f59e0b;">
                    <i class="fas fa-chart-line"></i> Campaign Reports
                </a>
                <a href="admin-visitors.html" class="btn btn-primary"
                    style="padding: 12px 24px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; background: #6366f1;">
                    <i class="fas fa-users"></i> Visitor Analytics
                </a>
            </div>
        </div>

        <div class="stats-grid">
            <a href="#registrationsTableBody" class="stat-card" onclick="filterRegistrations('all')">
                <h3>Total Students <i class="fas fa-chevron-right"></i></h3>
                <div class="value" id="totalUsersStat">0</div>
                <span class="manage-label">View List</span>
            </a>
            <a href="admin-courses.html" class="stat-card">
                <h3>Active Courses <i class="fas fa-chevron-right"></i></h3>
                <div class="value" id="activeCoursesStat">0</div>
                <span class="manage-label">Edit / Add / Delete</span>
            </a>
            <a href="admin-inquiries.html" class="stat-card">
                <h3>Total Inquiries <i class="fas fa-chevron-right"></i></h3>
                <div class="value" id="totalRevenueStat">0</div>
                <span class="manage-label">Manage Leads</span>
            </a>
            <a href="#registrationsTableBody" class="stat-card" onclick="filterRegistrations('new')">
                <h3>New Signups <i class="fas fa-chevron-right"></i></h3>
                <div class="value" id="newSignupsStat">0</div>
                <span class="manage-label">View Recent</span>
            </a>
        </div>

        <div class="data-table-container">
            <div class="table-header">
                <h2 style="font-size: 1.2rem; margin: 0; color: var(--text-color);">Recent Registrations</h2>
                <button class="btn btn-primary" style="padding: 8px 16px; font-size: 0.9rem;">Export Data</button>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>User</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Status</th>
                        <th>Date</th>
                    </tr>
                </thead>
                <tbody id="registrationsTableBody">
                    <!-- Dynamic data will be injected here -->
                </tbody>
            </table>
        </div>

    </div>

    <div id="footer-placeholder"></div>
    <script src="footer.js"></script>
    <script src="premium-courses-data.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // 1. Load Real Stats
            const registry = JSON.parse(localStorage.getItem('ss_user_registry') || '[]');
            const visitorLogs = JSON.parse(localStorage.getItem('skillspot_visitor_logs') || '[]');
            const inquiryRegistry = JSON.parse(localStorage.getItem('ss_inquiry_registry') || '[]');
            const customCourses = JSON.parse(localStorage.getItem('ss_custom_courses'));

            // Total Students
            document.getElementById('totalUsersStat').textContent = registry.length || '0';

            // Active Courses
            const courseList = customCourses || (window.premiumCourses || []);
            document.getElementById('activeCoursesStat').textContent = courseList.length;

            // Total Inquiries (From inquiry registry)
            document.getElementById('totalRevenueStat').textContent = inquiryRegistry.length;

            // New Signups (Last 7 days)
            const sevenDaysAgo = new Date();
            sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
            const newSignups = registry.filter(u => {
                const signupDate = new Date(u.date);
                return signupDate >= sevenDaysAgo;
            }).length;
            document.getElementById('newSignupsStat').textContent = '+' + newSignups;

            // 2. Populate Registrations Table
            window.filterRegistrations = function (type) {
                const tableBody = document.getElementById('registrationsTableBody');
                const title = document.querySelector('.table-header h2');

                let filtered = registry;
                if (type === 'new') {
                    filtered = registry.filter(u => {
                        const signupDate = new Date(u.date);
                        return signupDate >= sevenDaysAgo;
                    });
                    title.textContent = 'Recent Weekly Signups';
                } else {
                    title.textContent = 'Recent Registrations';
                }

                if (filtered.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; opacity: 0.5;">No registrations found.</td></tr>';
                } else {
                    tableBody.innerHTML = '';
                    filtered.slice(0, 10).forEach(user => {
                        const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td>
                                <div style="display: flex; align-items: center;">
                                    <span class="avatar">${initials}</span> 
                                    ${user.name}
                                </div>
                            </td>
                            <td>${user.email}</td>
                            <td>${user.role || 'Student'}</td>
                            <td><span class="status-badge status-active">Active</span></td>
                            <td>${user.date}</td>
                        `;
                        tableBody.appendChild(row);
                    });
                }
            };

            filterRegistrations('all');
        });
    </script>
</body>

</html>
