<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillspot.in - Student Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { 'primary': '#4F46E5', 'secondary': '#10B981', 'dark-bg': '#0F172A' },
                    animation: { 'slide-up': 'slideUp 0.4s ease-out' },
                    keyframes: { slideUp: { '0%': { transform: 'translateY(20px)', opacity: '0' }, '100%': { transform: 'translateY(0)', opacity: '1' } } }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Inter', sans-serif; height: 100vh; margin: 0; background-color: #F8FAFC; overflow: hidden; }
        
        /* STRICT HIDING LOGIC */
        .hidden { display: none !important; }
        #main-app { display: none; height: 100vh; width: 100%; } /* Hidden by default */
        
        .grid-pattern {
            background-image: linear-gradient(to right, rgba(79, 70, 229, 0.05) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(79, 70, 229, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }
        .loader { border: 2px solid #f3f3f3; border-top: 2px solid #4F46E5; border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="auth-page" class="fixed inset-0 grid-pattern flex items-center justify-center z-50 px-4">
        <div class="bg-white p-8 md:p-12 rounded-[2.5rem] shadow-2xl w-full max-w-md border border-white animate-slide-up">
            <div class="flex flex-col items-center mb-10 text-center">
                <div class="w-16 h-16 rounded-2xl bg-primary flex items-center justify-center shadow-lg mb-4 text-white">
                    <i class="fas fa-bolt text-3xl"></i>
                </div>
                <h2 id="auth-title" class="text-3xl font-extrabold tracking-tight">Skillspot Login</h2>
                <p id="auth-subtitle" class="text-slate-500 text-sm mt-1">Unlock your tech potential</p>
            </div>
            
            <div class="space-y-4">
                <input type="text" id="reg-name" placeholder="Full Name" class="hidden w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-primary transition-all">
                <input type="email" id="auth-email" placeholder="Email Address" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-primary transition-all">
                
                <div class="relative">
                    <input type="password" id="auth-pass" placeholder="Password" class="w-full p-4 bg-slate-50 border border-slate-200 rounded-2xl outline-none focus:ring-2 focus:ring-primary transition-all">
                    <button onclick="togglePass()" class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-400 hover:text-primary">
                        <i id="eye" class="fas fa-eye"></i>
                    </button>
                </div>

                <button onclick="handleForgot()" class="text-xs font-bold text-primary block text-right hover:underline">Forgot Password?</button>
                
                <button id="main-btn" onclick="handleAuth()" class="w-full bg-gradient-to-r from-primary to-indigo-600 text-white py-5 rounded-2xl font-bold shadow-lg flex items-center justify-center gap-3 transition-all active:scale-95">
                    <span id="btn-text">Sign In</span>
                    <div id="btn-loader" class="loader hidden"></div>
                </button>
                
                <p class="text-center text-sm text-slate-500 mt-6">
                    <span id="toggle-text">New to Skillspot?</span> 
                    <button onclick="toggleAuth()" id="toggle-btn" class="text-primary font-black hover:underline ml-1">Create Account</button>
                </p>
            </div>
        </div>
    </div>

    <div id="main-app" class="flex overflow-hidden">
        <aside class="w-64 lg:w-72 bg-dark-bg text-white flex flex-col shrink-0">
            <div class="p-8 border-b border-white/5 flex items-center gap-4">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-primary to-secondary flex items-center justify-center"><i class="fas fa-bolt text-white"></i></div>
                <h1 class="font-bold text-xl tracking-tight">Skillspot<span class="text-secondary">.in</span></h1>
            </div>
            
            <nav class="flex-1 p-6 space-y-3">
                <button onclick="navTo('lessons')" id="btn-nav-lessons" class="w-full flex items-center gap-4 p-4 rounded-2xl bg-primary shadow-lg transition">
                    <div class="w-6 text-center"><i class="fas fa-play-circle"></i></div>
                    <span class="font-semibold text-sm">Course Content</span>
                </button>
                <button onclick="navTo('dash')" id="btn-nav-dash" class="w-full flex items-center gap-4 p-4 rounded-2xl hover:bg-white/10 opacity-60 transition">
                    <div class="w-6 text-center"><i class="fas fa-th-large"></i></div>
                    <span class="font-semibold text-sm">Dashboard</span>
                </button>
                <button id="nav-admin" onclick="navTo('admin')" class="hidden w-full flex items-center gap-4 p-4 rounded-2xl text-amber-400 border border-amber-400/20 mt-6 transition">
                    <div class="w-6 text-center"><i class="fas fa-shield-halved"></i></div>
                    <span class="font-bold text-sm">Admin Console</span>
                </button>
            </nav>

            <div class="p-6 border-t border-white/5">
                <button onclick="logout()" class="w-full flex items-center gap-4 text-red-400 font-bold hover:bg-red-500/10 p-4 rounded-2xl transition">
                    <div class="w-6 text-center"><i class="fas fa-power-off"></i></div>
                    <span class="text-sm">Logout</span>
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-white overflow-hidden">
            <header class="bg-white border-b p-6 flex justify-between items-center z-20">
                <h2 class="text-xl font-black text-dark-bg" id="header-title">My Learning</h2>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-sm font-bold" id="user-name">User</p>
                        <p class="text-[10px] uppercase text-slate-400 font-black tracking-widest">Premium Student</p>
                    </div>
                    <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center text-white font-bold" id="avatar">?</div>
                </div>
            </header>

            <div class="flex-1 overflow-y-auto">
                <div id="view-lessons" class="view h-full flex flex-col lg:flex-row">
                    <div class="flex-1 bg-slate-900 flex flex-col overflow-y-auto">
                        <div class="aspect-video w-full bg-black flex items-center justify-center text-white relative group">
                            <i class="fas fa-play-circle text-8xl opacity-20 group-hover:opacity-40 transition-opacity cursor-pointer"></i>
                            <div class="absolute bottom-8 left-8">
                                <span class="bg-primary px-3 py-1 rounded-md text-[10px] font-bold mb-2 inline-block">MODULE 1</span>
                                <h3 class="text-2xl font-bold">Introduction to Skillspot</h3>
                            </div>
                        </div>
                        <div class="p-10 bg-white shadow-sm"><h3 class="text-2xl font-bold mb-4">Lecture Overview</h3><p class="text-slate-600">Learning content starting...</p></div>
                    </div>
                    <div class="w-full lg:w-96 border-l bg-slate-50 flex flex-col p-4 space-y-3">
                        <div class="p-4 font-black text-[10px] uppercase tracking-widest text-slate-400 border-b mb-2">Curriculum</div>
                        <div class="p-4 bg-white rounded-xl border border-primary/30 flex gap-4 items-center shadow-sm">
                            <div class="w-8 h-8 rounded-full bg-primary/10 flex items-center justify-center text-primary font-bold text-xs">1</div>
                            <div class="flex-1 font-bold text-sm">Welcome</div>
                            <i class="fas fa-check-circle text-primary"></i>
                        </div>
                    </div>
                </div>

                <div id="view-dash" class="view hidden p-12 animate-slide-up">
                    <h2 class="text-3xl font-black mb-8 text-dark-bg">Student Progress</h2>
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-slate-100 max-w-sm">
                        <p class="text-xs font-black text-slate-400 uppercase tracking-widest mb-4">Course Completed</p>
                        <p class="text-4xl font-black text-primary">14%</p>
                    </div>
                </div>

                <div id="view-admin" class="view hidden p-12 animate-slide-up">
                    <h2 class="text-2xl font-bold mb-8">Admin Control</h2>
                    <div class="bg-white rounded-[2.5rem] shadow-xl overflow-hidden border">
                        <table class="w-full text-left">
                            <thead class="bg-slate-50 border-b text-[10px] font-bold uppercase text-slate-400 tracking-widest">
                                <tr><th class="p-8">Student</th><th class="p-8 text-center">Status</th></tr>
                            </thead>
                            <tbody id="admin-table-body" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyndzHLKPDa-L5Bg8k12l4RCIaHt1ejVIsB8w8QHrmCvsgNd5A7knHYwXFzZjnjNRU4/exec";
        let isReg = false;

        window.onload = () => { 
            const u = localStorage.getItem('cp_user'); 
            if(u) enter(JSON.parse(u)); 
        };

        function toggleAuth() {
            isReg = !isReg;
            document.getElementById('auth-title').innerText = isReg ? 'Create Account' : 'Skillspot Login';
            document.getElementById('btn-text').innerText = isReg ? 'Enroll Now' : 'Sign In';
            document.getElementById('reg-name').classList.toggle('hidden', !isReg);
            document.getElementById('toggle-btn').innerText = isReg ? 'Login' : 'Create Account';
        }

        function togglePass() {
            const p = document.getElementById('auth-pass'), e = document.getElementById('eye');
            if(p.type === 'password') { p.type = 'text'; e.classList.replace('fa-eye', 'fa-eye-slash'); } 
            else { p.type = 'password'; e.classList.replace('fa-eye-slash', 'fa-eye'); }
        }

        function handleForgot() {
            const e = document.getElementById('auth-email').value;
            if(!e) return alert("Enter email address");
            window.open(`https://wa.me/919074854599?text=Reset%20Email:%20${e}`, '_blank');
        }

        async function handleAuth() {
            const email = document.getElementById('auth-email').value, pass = document.getElementById('auth-pass').value, name = document.getElementById('reg-name').value;
            if(!email || !pass) return alert("Missing fields");

            document.getElementById('btn-loader').classList.remove('hidden');
            try {
                const res = await fetch(`${SCRIPT_URL}?action=${isReg?'signup':'login'}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(pass)}&name=${encodeURIComponent(name)}`);
                const data = await res.json();
                if (data.status === 'success') {
                    if (isReg) { alert("Registration Done! Login now."); toggleAuth(); } 
                    else { localStorage.setItem('cp_user', JSON.stringify(data)); enter(data); }
                } else alert(data.message);
            } catch (e) { alert("Network error"); }
            finally { document.getElementById('btn-loader').classList.add('hidden'); }
        }

        function enter(user) {
            // STEP 1: Fully hide the centered Login Page
            document.getElementById('auth-page').style.display = 'none';
            // STEP 2: Make the Dashboard visible
            const app = document.getElementById('main-app');
            app.style.display = 'flex';
            
            document.getElementById('user-name').innerText = user.name;
            document.getElementById('avatar').innerText = user.name[0].toUpperCase();
            if(user.role.toLowerCase() === 'admin') document.getElementById('nav-admin').classList.remove('hidden');
            navTo('lessons'); 
        }

        function logout() { localStorage.removeItem('cp_user'); location.reload(); }
        
        function navTo(id) { 
            document.querySelectorAll('.view').forEach(v => v.classList.add('hidden')); 
            document.getElementById('view-'+id).classList.remove('hidden');
            
            document.getElementById('btn-nav-lessons').className = (id === 'lessons') 
                ? "w-full flex items-center gap-4 p-4 rounded-2xl bg-primary shadow-lg transition" 
                : "w-full flex items-center gap-4 p-4 rounded-2xl hover:bg-white/10 opacity-60 transition";
            
            document.getElementById('btn-nav-dash').className = (id === 'dash') 
                ? "w-full flex items-center gap-4 p-4 rounded-2xl bg-primary shadow-lg transition" 
                : "w-full flex items-center gap-4 p-4 rounded-2xl hover:bg-white/10 opacity-60 transition";

            if(id==='admin') fetchUsers(); 
        }

        async function fetchUsers() {
            const res = await fetch(SCRIPT_URL);
            const list = await res.json();
            document.getElementById('admin-table-body').innerHTML = list.map(u => `
                <tr><td class="p-8 font-bold">${u.name}<br><span class="text-xs text-slate-400 font-normal">${u.email}</span></td>
                <td class="p-8 text-center text-primary font-black uppercase text-xs">${u.role}</td></tr>`).join('');
        }
    </script>
</body>
</html>
