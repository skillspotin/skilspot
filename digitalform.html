<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillspot Digital | Agency Retainer Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ... (all your existing CSS remains the same) ... */
    </style>
</head>
<body class="antialiased">

    <!-- ... (all your existing HTML remains the same) ... -->

    <script>
    // Global variables to store selections
    let selectedMkt = null;
    let selectedMktPrice = 0;
    let selectedMktFeatures = '';
    let selectedWeb = null;
    let selectedWebPrice = 0;
    let selectedWebFeatures = '';

    // Theme Management
    const themeToggle = document.getElementById('theme-toggle');
    const sunIcon = document.getElementById('sun-icon');
    const moonIcon = document.getElementById('moon-icon');
    const body = document.body;

    // Check for saved theme preference or default to light
    if (localStorage.getItem('dark-mode') === 'true') {
        body.classList.add('dark');
        sunIcon.classList.remove('hidden');
        moonIcon.classList.add('hidden');
    } else {
        body.classList.remove('dark');
        sunIcon.classList.add('hidden');
        moonIcon.classList.remove('hidden');
    }

    themeToggle.addEventListener('click', () => {
        body.classList.toggle('dark');
        if (body.classList.contains('dark')) {
            sunIcon.classList.remove('hidden');
            moonIcon.classList.add('hidden');
            localStorage.setItem('dark-mode', 'true');
        } else {
            sunIcon.classList.add('hidden');
            moonIcon.classList.remove('hidden');
            localStorage.setItem('dark-mode', 'false');
        }
    });

    // Mobile Menu Toggle
    const mobileMenuBtn = document.getElementById('mobile-menu-btn');
    const mobileMenu = document.getElementById('mobile-menu');
    let isMenuOpen = false;

    mobileMenuBtn.addEventListener('click', () => {
        isMenuOpen = !isMenuOpen;
        if (isMenuOpen) {
            mobileMenu.style.maxHeight = mobileMenu.scrollHeight + 'px';
            mobileMenuBtn.innerHTML = '<i class="fas fa-times text-xl text-gray-700 dark:text-gray-300"></i>';
        } else {
            mobileMenu.style.maxHeight = '0';
            mobileMenuBtn.innerHTML = '<i class="fas fa-bars text-xl text-gray-700 dark:text-gray-300"></i>';
        }
    });

    // Close mobile menu when clicking outside
    document.addEventListener('click', (e) => {
        if (!mobileMenu.contains(e.target) && !mobileMenuBtn.contains(e.target) && isMenuOpen) {
            mobileMenu.style.maxHeight = '0';
            mobileMenuBtn.innerHTML = '<i class="fas fa-bars text-xl text-gray-700 dark:text-gray-300"></i>';
            isMenuOpen = false;
        }
    });

    // Step Navigation
    let currentStep = 1;

    function goToStep(step) {
        // Hide all steps
        document.querySelectorAll('.step').forEach(stepEl => {
            stepEl.classList.remove('active');
        });
        
        // Show target step
        document.getElementById(`step${step}`).classList.add('active');
        
        // Update current step
        currentStep = step;
        
        // Update progress bar
        const progressFill = document.getElementById('progress-fill');
        progressFill.style.width = `${(step/4) * 100}%`;
        
        // Update step indicators
        updateStepIndicators(step);
        
        // Scroll to top of step
        window.scrollTo({ top: document.querySelector('.step-indicator').offsetTop - 100, behavior: 'smooth' });
    }

    function updateStepIndicators(activeStep) {
        // Reset all dots
        for (let i = 1; i <= 4; i++) {
            const dot = document.getElementById(`step${i}-dot`);
            dot.classList.remove('active', 'completed');
            
            if (i < activeStep) {
                dot.classList.add('completed');
            } else if (i === activeStep) {
                dot.classList.add('active');
            }
        }
    }

    // Plan Selection Functions
    function selectMkt(planName, price, features) {
        selectedMkt = planName;
        selectedMktPrice = price;
        selectedMktFeatures = features;
        
        // Remove selected class from all marketing cards
        document.querySelectorAll('#step1 .plan-card').forEach(card => {
            card.classList.remove('selected');
        });
        
        // Add selected class to clicked card
        event.currentTarget.classList.add('selected');
        
        // Update selected display
        document.getElementById('selected-mkt').textContent = `${planName} - ₹${price.toLocaleString('en-IN')}/month`;
        
        // Show toast notification
        showToast(`Marketing plan selected: ${planName}`);
    }

    function selectWeb(planName, price, features) {
        selectedWeb = planName;
        selectedWebPrice = price;
        selectedWebFeatures = features;
        
        // Remove selected class from all web cards
        document.querySelectorAll('#step2 .plan-card').forEach(card => {
            card.classList.remove('selected');
        });
        
        // Add selected class to clicked card
        event.currentTarget.classList.add('selected');
        
        // Update selected display
        document.getElementById('selected-web').textContent = `${planName} - ₹${price.toLocaleString('en-IN')}/month`;
        
        // Show toast notification
        showToast(`Website plan selected: ${planName}`);
    }

    // Toast notification function
    function showToast(message) {
        // Remove existing toast if any
        const existingToast = document.querySelector('.toast-notification');
        if (existingToast) {
            existingToast.remove();
        }
        
        // Create toast element
        const toast = document.createElement('div');
        toast.className = 'toast-notification fixed bottom-4 right-4 bg-indigo-600 text-white px-6 py-3 rounded-lg shadow-lg z-50 transform transition-all duration-300 translate-y-10 opacity-0';
        toast.innerHTML = `
            <div class="flex items-center gap-3">
                <i class="fas fa-check-circle"></i>
                <span>${message}</span>
            </div>
        `;
        
        document.body.appendChild(toast);
        
        // Animate in
        setTimeout(() => {
            toast.style.transform = 'translateY(0)';
            toast.style.opacity = '1';
        }, 10);
        
        // Remove after 3 seconds
        setTimeout(() => {
            toast.style.transform = 'translateY(10px)';
            toast.style.opacity = '0';
            setTimeout(() => toast.remove(), 300);
        }, 3000);
    }

    // ========== GOOGLE SHEETS SAVING FUNCTION ==========
    function saveQuoteToGoogleSheets() {
        try {
            // Get form values
            const business = document.getElementById('custBusiness').value || '';
            const name = document.getElementById('custName').value || '';
            const phone = document.getElementById('custPhone').value || '';
            const email = document.getElementById('custEmail').value || '';
            
            // Calculate total
            const total = (selectedMktPrice || 0) + (selectedWebPrice || 0);
            
            // Your Google Apps Script URL
            const scriptURL = 'https://script.google.com/macros/s/AKfycbxHBEuuXTvyN2W3wzbuUhDtbuq9AL_qk9FU-MYZZARpmenVhhyNf9fYBWXQCZUp7s5F/exec';
            
            // Build URL with all data as GET parameters
            let url = scriptURL + '?';
            url += 'business=' + encodeURIComponent(business);
            url += '&name=' + encodeURIComponent(name);
            url += '&phone=' + encodeURIComponent(phone);
            url += '&email=' + encodeURIComponent(email);
            url += '&marketingPlan=' + encodeURIComponent(selectedMkt || '');
            url += '&marketingPrice=' + (selectedMktPrice || 0);
            url += '&websitePlan=' + encodeURIComponent(selectedWeb || '');
            url += '&websitePrice=' + (selectedWebPrice || 0);
            url += '&total=' + total;
            url += '&source=SkillSpotQuotePortal';
            
            console.log('Saving to Google Sheets:', url);
            
            // Method 1: Use image pixel technique (works with CORS)
            const img = new Image();
            img.src = url;
            
            // Method 2: Also try fetch as backup
            fetch(url, { mode: 'no-cors' })
                .then(() => console.log('Data saved to Google Sheets'))
                .catch(e => console.log('Fetch failed, image method used'));
            
            // Show success toast
            showToast('✓ Quote saved to database!');
            
            return true;
            
        } catch (error) {
            console.error('Error saving to Google Sheets:', error);
            // Don't show error to user - fail silently
            return false;
        }
    }
    // ========== END GOOGLE SHEETS FUNCTION ==========

    // Step 3 Validation and Navigation
    function validateAndGoToStep4() {
        const business = document.getElementById('custBusiness').value.trim();
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        
        // Basic validation
        if (!business) {
            alert('Please enter your business name');
            document.getElementById('custBusiness').focus();
            return;
        }
        
        if (!name) {
            alert('Please enter your name');
            document.getElementById('custName').focus();
            return;
        }
        
        if (!phone || phone.length < 10) {
            alert('Please enter a valid WhatsApp number');
            document.getElementById('custPhone').focus();
            return;
        }
        
        // Check if at least one plan is selected
        if (!selectedMkt && !selectedWeb) {
            alert('Please select at least one plan from Marketing or Website sections');
            return;
        }
        
        // Generate quote summary
        generateQuoteSummary();
        
        // SAVE TO GOOGLE SHEETS
        saveQuoteToGoogleSheets();
        
        // Go to step 4
        goToStep(4);
    }

    // Generate Quote Summary
    function generateQuoteSummary() {
        const business = document.getElementById('custBusiness').value.trim();
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        const email = document.getElementById('custEmail').value.trim();
        
        // Set business info
        document.getElementById('summary-business').textContent = `${business} | ${name}`;
        
        // Set date
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric' };
        document.getElementById('summary-date').textContent = now.toLocaleDateString('en-IN', options);
        
        let total = 0;
        
        // Marketing Plan Summary
        if (selectedMkt) {
            document.getElementById('summary-mkt').classList.remove('hidden');
            document.getElementById('summary-mkt-name').textContent = selectedMkt;
            document.getElementById('summary-mkt-price').textContent = `₹${selectedMktPrice.toLocaleString('en-IN')}`;
            
            // Parse features into list items
            const featureItems = selectedMktFeatures.split('<br>');
            const mktItemsContainer = document.getElementById('summary-mkt-items');
            mktItemsContainer.innerHTML = '';
            
            featureItems.forEach(feature => {
                if (feature.trim()) {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-2';
                    item.innerHTML = `
                        <i class="fas fa-check-circle text-green-500 text-xs"></i>
                        <span class="text-sm text-light-gray">${feature.replace('✔ ', '')}</span>
                    `;
                    mktItemsContainer.appendChild(item);
                }
            });
            
            total += selectedMktPrice;
        } else {
            document.getElementById('summary-mkt').classList.add('hidden');
        }
        
        // Web Plan Summary
        if (selectedWeb) {
            document.getElementById('summary-web').classList.remove('hidden');
            document.getElementById('summary-web-name').textContent = selectedWeb;
            document.getElementById('summary-web-price').textContent = `₹${selectedWebPrice.toLocaleString('en-IN')}`;
            
            // Parse features into list items
            const featureItems = selectedWebFeatures.split('<br>');
            const webItemsContainer = document.getElementById('summary-web-items');
            webItemsContainer.innerHTML = '';
            
            featureItems.forEach(feature => {
                if (feature.trim()) {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-2';
                    item.innerHTML = `
                        <i class="fas fa-check-circle text-green-500 text-xs"></i>
                        <span class="text-sm text-light-gray">${feature.replace('✔ ', '')}</span>
                    `;
                    webItemsContainer.appendChild(item);
                }
            });
            
            total += selectedWebPrice;
        } else {
            document.getElementById('summary-web').classList.add('hidden');
        }
        
        // Set total
        document.getElementById('summary-total').textContent = `₹${total.toLocaleString('en-IN')}`;
        
        // Also set print area data
        setPrintData(business, name, phone, email, total);
    }

    // Set Print Data for PDF
    function setPrintData(business, name, phone, email, total) {
        // Set client details
        document.getElementById('resBusiness').textContent = business;
        document.getElementById('resName').textContent = name;
        document.getElementById('resPhone').textContent = `Phone: ${phone}`;
        document.getElementById('resEmail').textContent = email ? `Email: ${email}` : '';
        
        // Set date
        const now = new Date();
        document.getElementById('printDate').textContent = now.toLocaleDateString('en-IN', { 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric' 
        });
        
        // Marketing plan print section
        if (selectedMkt) {
            document.getElementById('printMkt').classList.remove('hidden');
            document.getElementById('pMktName').textContent = selectedMkt;
            document.getElementById('pMktPrice').textContent = `₹${selectedMktPrice.toLocaleString('en-IN')}/month`;
            
            const featureItems = selectedMktFeatures.split('<br>');
            const pMktItemsContainer = document.getElementById('pMktItems');
            pMktItemsContainer.innerHTML = '';
            
            featureItems.forEach(feature => {
                if (feature.trim()) {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-2';
                    item.innerHTML = `
                        <div class="w-1.5 h-1.5 bg-indigo-600 rounded-full"></div>
                        <span>${feature.replace('✔ ', '')}</span>
                    `;
                    pMktItemsContainer.appendChild(item);
                }
            });
        } else {
            document.getElementById('printMkt').classList.add('hidden');
        }
        
        // Web plan print section
        if (selectedWeb) {
            document.getElementById('printWeb').classList.remove('hidden');
            document.getElementById('pWebName').textContent = selectedWeb;
            document.getElementById('pWebPrice').textContent = `₹${selectedWebPrice.toLocaleString('en-IN')}/month`;
            
            const featureItems = selectedWebFeatures.split('<br>');
            const pWebItemsContainer = document.getElementById('pWebItems');
            pWebItemsContainer.innerHTML = '';
            
            featureItems.forEach(feature => {
                if (feature.trim()) {
                    const item = document.createElement('div');
                    item.className = 'flex items-center gap-2';
                    item.innerHTML = `
                        <div class="w-1.5 h-1.5 bg-gray-800 rounded-full"></div>
                        <span>${feature.replace('✔ ', '')}</span>
                    `;
                    pWebItemsContainer.appendChild(item);
                }
            });
        } else {
            document.getElementById('printWeb').classList.add('hidden');
        }
        
        // Set total
        document.getElementById('resTotal').textContent = `₹${total.toLocaleString('en-IN')}`;
    }

    // Download PDF
    function downloadPDF() {
        // Check if at least one plan is selected
        if (!selectedMkt && !selectedWeb) {
            alert('Please select at least one plan before downloading the quote');
            goToStep(1);
            return;
        }
        
        // Check if client details are filled
        const business = document.getElementById('custBusiness').value.trim();
        if (!business) {
            alert('Please fill in your business details first');
            goToStep(3);
            return;
        }
        
        // Show loading indicator
        const loadingDiv = document.createElement('div');
        loadingDiv.className = 'pdf-loading';
        loadingDiv.innerHTML = `
            <div class="spinner"></div>
            <p>Generating PDF quote...</p>
        `;
        document.body.appendChild(loadingDiv);
        
        // Configure PDF options
        const element = document.getElementById('printArea');
        const opt = {
            margin: 0.5,
            filename: `SkillSpot-Quote-${business.replace(/\s+/g, '-')}.pdf`,
            image: { type: 'jpeg', quality: 0.98 },
            html2canvas: { 
                scale: 2,
                useCORS: true,
                letterRendering: true,
                backgroundColor: '#FFFFFF'
            },
            jsPDF: { 
                unit: 'mm', 
                format: 'a4', 
                orientation: 'portrait',
                compress: true
            }
        };
        
        // Generate and download PDF
        html2pdf().set(opt).from(element).save().then(() => {
            // Remove loading indicator
            loadingDiv.remove();
            
            // Show success message
            showToast('PDF quote downloaded successfully!');
        }).catch(error => {
            loadingDiv.remove();
            alert('Error generating PDF: ' + error.message);
        });
    }

    // Share via WhatsApp
    function shareViaWhatsApp() {
        // Check if at least one plan is selected
        if (!selectedMkt && !selectedWeb) {
            alert('Please select at least one plan before sharing');
            goToStep(1);
            return;
        }
        
        const business = document.getElementById('custBusiness').value.trim();
        const name = document.getElementById('custName').value.trim();
        const phone = document.getElementById('custPhone').value.trim();
        
        if (!phone) {
            alert('Please enter your WhatsApp number first');
            goToStep(3);
            return;
        }
        
        let total = (selectedMktPrice || 0) + (selectedWebPrice || 0);
        
        // Create message
        let message = `Hello SkillSpot Team,\n\n`;
        message += `I'm interested in your services!\n\n`;
        message += `*Business:* ${business}\n`;
        message += `*Name:* ${name}\n`;
        message += `*Phone:* ${phone}\n\n`;
        
        if (selectedMkt) {
            message += `*Marketing Plan:* ${selectedMkt} - ₹${selectedMktPrice.toLocaleString('en-IN')}/month\n`;
        }
        
        if (selectedWeb) {
            message += `*Website Plan:* ${selectedWeb} - ₹${selectedWebPrice.toLocaleString('en-IN')}/month\n`;
        }
        
        message += `\n*Total Monthly:* ₹${total.toLocaleString('en-IN')}\n\n`;
        message += `Please send me more details about how to get started.`;
        
        // Encode message for URL
        const encodedMessage = encodeURIComponent(message);
        
        // Create WhatsApp URL
        const whatsappURL = `https://wa.me/919074854599?text=${encodedMessage}`;
        
        // Open WhatsApp in new tab
        window.open(whatsappURL, '_blank');
        
        // Show confirmation
        showToast('Opening WhatsApp...');
    }

    // Start New Quote
    function startNewQuote() {
        // Reset selections
        selectedMkt = null;
        selectedMktPrice = 0;
        selectedMktFeatures = '';
        selectedWeb = null;
        selectedWebPrice = 0;
        selectedWebFeatures = '';
        
        // Reset UI
        document.querySelectorAll('.plan-card').forEach(card => {
            card.classList.remove('selected');
        });
        
        document.getElementById('selected-mkt').textContent = 'None';
        document.getElementById('selected-web').textContent = 'None';
        
        // Clear form fields
        document.getElementById('custBusiness').value = '';
        document.getElementById('custName').value = '';
        document.getElementById('custPhone').value = '';
        document.getElementById('custEmail').value = '';
        
        // Go back to step 1
        goToStep(1);
        
        // Show confirmation
        showToast('New quote started!');
    }

    // Initialize when page loads
    document.addEventListener('DOMContentLoaded', function() {
        // Update step indicators
        updateStepIndicators(1);
        
        // Add smooth scroll for anchor links
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if (targetId && targetId !== '#') {
                    const targetElement = document.querySelector(targetId);
                    if (targetElement) {
                        window.scrollTo({
                            top: targetElement.offsetTop - 80,
                            behavior: 'smooth'
                        });
                    }
                }
            });
        });
        
        // Newsletter form submission
        const newsletterForm = document.querySelector('footer form');
        if (newsletterForm) {
            newsletterForm.addEventListener('submit', function(e) {
                e.preventDefault();
                const emailInput = this.querySelector('input[type="email"]');
                if (emailInput.value.trim()) {
                    showToast('Thank you for subscribing!');
                    emailInput.value = '';
                }
            });
        }
        
        // Initialize with step 1
        goToStep(1);
    });
    </script>
</body>
</html>
