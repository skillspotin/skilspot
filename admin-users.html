<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Management - Admin | SkillSpot.in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=3">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-color: #1e293b;
            --card-bg: white;
            --border-color: #e2e8f0;
            --primary: #6366f1;
        }

        body.dark-mode {
            --bg-color: #0f172a;
            --text-color: #f8fafc;
            --card-bg: rgba(255, 255, 255, 0.05);
            --border-color: rgba(255, 255, 255, 0.1);
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            margin: 0;
            padding-bottom: 60px;
        }

        .admin-container {
            padding: 120px 20px 60px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .user-table-container {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .user-table {
            width: 100%;
            border-collapse: collapse;
        }

        .user-table th {
            text-align: left;
            padding: 15px 20px;
            background: rgba(0, 0, 0, 0.02);
            font-weight: 700;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 2px solid var(--border-color);
        }

        .user-table td {
            padding: 15px 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 0.8rem;
            margin-right: 12px;
        }

        .btn-action {
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            margin-right: 5px;
        }

        .btn-delete:hover {
            background: #ef4444;
            color: white;
            border-color: #ef4444;
        }

        .empty-state {
            text-align: center;
            padding: 60px;
            opacity: 0.5;
        }
    </style>
</head>

<body>
    <div id="navbar-placeholder"></div>
    <script src="navbar.js"></script>

    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 40px;">
            <div>
                <h1 style="font-size: 2rem; font-weight: 800; margin: 0;">Student <span
                        class="gradient-text">Directory</span></h1>
                <p style="opacity: 0.7; margin-top: 5px;">View and manage registered students on SkillSpot.</p>
            </div>
            <div style="font-size: 0.9rem; font-weight: 600;">
                Total: <span id="totalCount">0</span>
            </div>
        </div>

        <div class="user-table-container">
            <table class="user-table">
                <thead>
                    <tr>
                        <th>Student</th>
                        <th>Email</th>
                        <th>Joined Date</th>
                        <th>Role</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Users injected here -->
                </tbody>
            </table>
            <div id="emptyState" class="empty-state" style="display: none;">
                <i class="fas fa-users-slash fa-3x" style="margin-bottom: 15px;"></i>
                <h2>No students registered yet</h2>
                <p>User accounts will appear here once they sign up.</p>
            </div>
        </div>
    </div>

    <script>
        function loadUsers() {
            const registry = JSON.parse(localStorage.getItem('ss_user_registry') || '[]');
            const body = document.getElementById('userTableBody');
            const empty = document.getElementById('emptyState');
            const counter = document.getElementById('totalCount');

            counter.textContent = registry.length;

            if (registry.length === 0) {
                empty.style.display = 'block';
                body.parentElement.style.display = 'none';
                return;
            }

            empty.style.display = 'none';
            body.parentElement.style.display = 'table';
            body.innerHTML = '';

            registry.forEach((user, index) => {
                const initials = user.name.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>
                        <div style="display: flex; align-items: center;">
                            <div class="avatar">${initials}</div>
                            <div style="font-weight: 600;">${user.name}</div>
                        </div>
                    </td>
                    <td>${user.email}</td>
                    <td>${user.date || 'N/A'}</td>
                    <td><span style="font-size: 0.7rem; background: rgba(99,102,241,0.1); color: var(--primary); padding: 4px 8px; border-radius: 6px; font-weight: 700;">${user.role || 'Student'}</span></td>
                    <td>
                        <button class="btn-action btn-delete" onclick="deleteUser(${index})">Delete</button>
                    </td>
                `;
                body.appendChild(row);
            });
        }

        function deleteUser(index) {
            if (confirm('Are you sure you want to delete this user? This cannot be undone.')) {
                const registry = JSON.parse(localStorage.getItem('ss_user_registry') || '[]');
                registry.splice(index, 1);
                localStorage.setItem('ss_user_registry', JSON.stringify(registry));
                loadUsers();
            }
        }

        loadUsers();
    </script>
</body>

</html>
